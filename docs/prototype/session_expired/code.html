<!DOCTYPE html>

<html class="light" lang="es"><head>

        }

                    "on-primary": "#ffffff",
                    "on-secondary-container": "#fefcff",
                    "inverse-primary": "#62df7d",
                    "on-tertiary-fixed-variant": "#8a143c",
                    "on-primary-container": "#f7fff2",
                    "secondary-fixed-dim": "#b4c5ff",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed": "#00174b",
                    "secondary-container": "#316bf3",

            "spacing": {

                    "base": "4px",

                    "md": "24px",

                    "xl": "48px",
                    "gutter": "24px"

            "fontFamily": {
                    "body-lg": ["Inter"],

                    "label-sm": ["Inter"]

                    "display-xl": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation Bar (JSON Guided) -->
<header class="sticky top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/60 dark:border-slate-800/60 shadow-sm">
<nav class="flex justify-between items-center px-6 py-3 max-w-7xl mx-auto w-full">
<div class="text-xl font-extrabold tracking-tight text-emerald-700 dark:text-emerald-400 font-['Plus_Jakarta_Sans']">
                BarrioConecta
            </div>
<div class="hidden md:flex items-center space-x-8 font-['Plus_Jakarta_Sans'] text-sm font-medium">
<a class="text-slate-600 dark:text-slate-400 hover:text-emerald-500 transition-colors" href="#">Explorar</a>
<a class="text-slate-600 dark:text-slate-400 hover:text-emerald-500 transition-colors" href="#">Categorías</a>
<a class="text-slate-600 dark:text-slate-400 hover:text-emerald-500 transition-colors" href="#">Soy comerciante</a>
</div>
<div class="flex items-center gap-4">
<button class="bg-primary text-on-primary px-6 py-2 rounded-full font-label-sm active:scale-95 transition-transform duration-200">
                    Iniciar Sesión
                </button>
</div>
</nav>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-gutter py-xl">
<div class="max-w-md w-full text-center space-y-lg">
<!-- Illustration Component (Bento-style depth card) -->
<div class="relative group">
<div class="absolute -inset-1 bg-gradient-to-r from-primary to-secondary opacity-10 blur-xl group-hover:opacity-20 transition duration-1000 group-hover:duration-200"></div>
<div class="relative bg-surface-container-lowest rounded-3xl p-xl shadow-[0_10px_15px_-3px_rgba(0,107,44,0.05)] border border-outline-variant/30 overflow-hidden">
<!-- Broken Link / Locked Door Icon Visualization -->
<div class="flex justify-center mb-md">
<div class="w-32 h-32 bg-primary-fixed rounded-full flex items-center justify-center relative overflow-hidden">
<span class="material-symbols-outlined text-primary text-[64px]" data-icon="lock_reset">lock_reset</span>
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent"></div>
</div>
</div>
<!-- Textual Content -->
<div class="space-y-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
                            Tu sesión ha expirado
                        </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[320px] mx-auto">
                            Inicia sesión nuevamente para continuar gestionando tu negocio o explorando el barrio.
                        </p>
</div>
<!-- Action Section -->
<div class="mt-xl pt-md border-t border-outline-variant/20">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-headline-md text-body-md py-4 rounded-xl shadow-lg hover:shadow-primary/20 transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-base">
<span class="material-symbols-outlined" data-icon="login">login</span>
                            Iniciar sesión
                        </button>
<div class="mt-md">
<a class="inline-flex items-center gap-xs font-label-sm text-primary hover:text-primary-container transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                                Volver al inicio
                            </a>
</div>
</div>
</div>
</div>
<!-- Background Decoration Blobs -->
<div class="fixed top-1/4 -left-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-secondary/5 rounded-full blur-3xl -z-10"></div>
</div>
</main>
<!-- Footer Meta-Links -->
<footer class="py-lg px-gutter border-t border-outline-variant/20">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-md">
<p class="font-label-sm text-on-surface-variant/70">
                © 2024 BarrioConecta. Conectando lo local.
            </p>
<div class="flex gap-lg font-label-sm text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Ayuda</a>
<a class="hover:text-primary transition-colors" href="#">Privacidad</a>
<a class="hover:text-primary transition-colors" href="#">Términos</a>
</div>
</div>
</footer>
<!-- Bottom Nav Bar (Mobile Only - Suppressed logic context) -->
<!-- Logic: Suppressed because page intent is Task-Focused/Linear (Re-login) -->
