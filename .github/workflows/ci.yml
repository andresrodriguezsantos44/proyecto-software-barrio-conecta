name: CI

# Pipeline de Integración Continua de BarrioConecta.
# - En cada Pull Request: lint + typecheck + tests + build (gates de calidad).
# - En cada push a main: lo anterior + despliegue automático a producción.
on:
  pull_request:
  push:
    branches: [main]

# Cancela ejecuciones previas de la misma rama/PR para no acumular runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — Calidad estática: ESLint + comprobación de tipos (TS / vue-tsc)
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  # ---------------------------------------------------------------------------
  # Gate 2 — Pruebas: unitarias + integración (API con bun test) y web (Vitest)
  # Un contenedor de MongoDB queda disponible para los tests de integración.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://localhost:27017/barrio-conecta-test
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 1h

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test — API (bun test + supertest)
        run: bun run test:api

      - name: Test — Web (Vitest)
        run: bun run test:web

  # ---------------------------------------------------------------------------
  # Gate 3 — Build de producción del frontend (Vite)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (Vite)
        run: bun run --cwd apps/web build

  # ---------------------------------------------------------------------------
  # Despliegue a producción — SOLO en push/merge a main y si pasan los 3 gates.
  # Frontend → Vercel · Backend → Render (vía Deploy Hook).
  # Requiere los secrets del repositorio (ver README → "Secrets de CI/CD").
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (producción)
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy Frontend → Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN no configurado — se omite el deploy de frontend."
            exit 0
          fi
          bun add -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy Backend → Render (Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK no configurado — se omite el deploy de backend."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
