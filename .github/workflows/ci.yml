name: CI

# Pipeline de Integración Continua de BarrioConecta.
# - En cada Pull Request: lint + typecheck + tests + build (gates de calidad).
# - En cada push a main: lo anterior + despliegue automático a producción.
on:
  pull_request:
  push:
    branches: [main]

# Cancela ejecuciones previas de la misma rama/PR para no acumular runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — Calidad estática: ESLint + comprobación de tipos (TS / vue-tsc)
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  # ---------------------------------------------------------------------------
  # Gate 2 — Pruebas: unitarias + integración (API) y web (Vitest).
  # Los tests de integración levantan MongoDB en memoria (mongodb-memory-server);
  # el binario de mongod se cachea entre ejecuciones. La API exige cobertura ≥85%.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test — API (integración + cobertura ≥85%)
        run: bun run --cwd apps/api test:coverage

      - name: Test — Web (Vitest)
        run: bun run test:web

  # ---------------------------------------------------------------------------
  # Gate 3 — Build de producción del frontend (Vite)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (Vite)
        run: bun run --cwd apps/web build

  # ---------------------------------------------------------------------------
  # Gate 4 — E2E con Playwright contra el SPA (Vue) + API con Mongo en memoria.
  # El servidor E2E levanta mongodb-memory-server, así que no requiere servicios.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E (Playwright)
        run: bun run --cwd apps/web test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Despliegue a producción — SOLO en push/merge a main y si pasan los gates.
  # Frontend → Vercel · Backend → Render (vía Deploy Hook).
  # Requiere los secrets del repositorio (ver README → "Secrets de CI/CD").
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (producción)
    runs-on: ubuntu-latest
    needs: [quality, test, build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy Frontend → Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN no configurado — se omite el deploy de frontend."
            exit 0
          fi
          bun add -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy Backend → Render (Deploy Hook)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK no configurado — se omite el deploy de backend."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
